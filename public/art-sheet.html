<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Сад слогов — лист иллюстраций</title>
    <style>
      /* Служебная страница для правки материала.
         В собранный сайт не попадает: см. DEV_ONLY в build.mjs. */
      :root {
        --bg: #f7f7ef;
        --ink: #243e36;
        --muted: #667269;
        --line: #dfe4d8;
        font-family: ui-rounded, "Trebuchet MS", Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 20px 60px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .lead {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 24px;
        line-height: 1.6;
      }
      h2 {
        font-size: 15px;
        margin: 32px 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        background: #fffefa;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px 10px 12px;
      }
      figure svg {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 6px;
      }
      figcaption b {
        font-size: 16px;
        letter-spacing: 0.04em;
      }
      figcaption span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .tag {
        display: inline-block;
        background: #e8eee1;
        border-radius: 6px;
        padding: 1px 6px;
        margin: 2px 2px 0;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .tag.weak {
        background: #f6e2cf;
      }
      .problem {
        background: #fbe7e0;
        border-color: #e4b6a6;
      }
      ul {
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Лист иллюстраций</h1>
    <p class="lead">
      Все рисунки слов из <code>art.js</code> рядом со словами из
      <code>curriculum.js</code>. Здесь удобно сверять стиль и ловить
      перепутанные ключи. Метка над словом — слоги, которым оно учит; оранжевая
      означает безударную «О», объявленную через <code>unstressed</code>.
    </p>
    <div id="sheet"></div>
    <script src="curriculum.js"></script>
    <script src="art.js"></script>
    <script>
      "use strict";
      const sheet = document.getElementById("sheet");
      const parts = [];

      for (const letter of CURRICULUM.letters) {
        const syllables = CURRICULUM.syllablesOf(letter.id);
        // Слово показываем у той буквы, чей слог оно учит первым по порядку.
        const words = CURRICULUM.words.filter((w) =>
          w.teaches.some((s) => syllables.includes(s)),
        );
        parts.push(
          `<h2>${letter.id} — ${syllables.join(", ")} · «${letter.sound}»</h2><div class="grid">` +
            words
              .map((w) => {
                const missing = !ART.has(w.art);
                const tags = w.teaches
                  .map(
                    (s) =>
                      `<span class="tag ${(w.unstressed || []).includes(s) ? "weak" : ""}">${s}@${w.at[s]}</span>`,
                  )
                  .join("");
                return `<figure class="${missing ? "problem" : ""}">${
                  missing
                    ? `<p style="text-align:center">нет рисунка<br><code>${w.art}</code></p>`
                    : ART.word(w.art)
                }<figcaption><b>${w.word}</b><span>${w.spoken} · ${w.art}</span>${tags}</figcaption></figure>`;
              })
              .join("") +
            `</div>`,
        );
      }

      const used = new Set(CURRICULUM.words.map((w) => w.art));
      const orphans = ART.keys().filter((k) => !used.has(k));
      if (orphans.length)
        parts.push(
          `<h2>Рисунки без слова</h2><ul>${orphans.map((k) => `<li>${k}</li>`).join("")}</ul>`,
        );

      sheet.innerHTML = parts.join("");
    </script>
  </body>
</html>
