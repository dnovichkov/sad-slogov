# Сайт «Сад слогов» за nginx. TLS и редирект с http терминирует Caddy из sites_configs,
# сюда запросы приходят по внутренней сети web уже расшифрованными.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Приложение живёт на одном адресе «/», клиентских маршрутов нет:
    # отсутствующий файл — это 404, а не index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # Имена файлов не содержат хешей (см. DEPLOY.md), поэтому браузер перепроверяет их
    # при каждом заходе: иначе после обновления в кэше останется старый JS с новым HTML.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Для healthcheck в docker-compose.prod.yml.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
